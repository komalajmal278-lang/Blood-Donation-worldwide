<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Worldwide Blood Donation</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff0f0;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            max-width: 420px;
            margin: 45px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h2 { text-align: center; color: #c62828; }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled { opacity: 0.7; cursor: wait; }

        #message {
            margin-top: 16px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 2;
        }

        a { color: #c62828; }
    </style>
</head>

<body>
<header>
    <h1>🩸 Worldwide Blood Donation</h1>
    <p>Welcome Back!</p>
</header>

<main class="container">
    <h2>Login to Your Account</h2>

    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               autocomplete="current-password" required>

        <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
        <p>Don't have an account?</p>
        <a href="register.html">Register as a Donor</a>
        <br>
        <a href="index.html">Back to Home</a>
    </div>
</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        message.textContent = "";
        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const response = await fetch(
                "http://localhost:5000/api/auth/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {
                message.style.color = "#c62828";
                message.textContent =
                    result.message || "Login failed. Please try again.";
                return;
            }

            sessionStorage.setItem("token", result.token);
            sessionStorage.setItem("name", result.donor.fullName);
            sessionStorage.setItem("donor", JSON.stringify(result.donor));

            message.style.color = "green";
            message.textContent = "Login successful!";

            // Dashboard page abhi banani baqi ho sakti hai.
            window.location.href = "dashboard.html";

        } catch (error) {
            console.error("Login error:", error);
            message.style.color = "#c62828";
            message.textContent =
                "Backend se connection nahi ho saka. Server check karein.";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    });
</script>
</body>
</html>
